<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>FilmezzOkosan.hu</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary p-2">
            <div class="container-fluid">
                <a class="navbar-brand brand-title" href="#">
                    <img src="img/LOGO.png" alt="Logo" width="44" height="24" class="d-inline-block align-text-top">
                    <span style="color: #ffffff;">Filmezz</span><span style="color: #85FFF5;">Okosan</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item m-2">
                            <a class="nav-link active" href="#felfedezes" data-nezet="felfedezes"
                                id="mindenMegjelen">Felfedezés</a>
                        </li>
                        <li class="nav-item m-2">
                            <a class="nav-link" href="#filmek" data-nezet="filmek" id="filmekMegjelenes">Filmek</a>
                        </li>
                        <li class="nav-item m-2">
                            <a class="nav-link" href="#sorozatok" data-nezet="sorozatok"
                                id="sorozatokMegjelenes">Sorozatok</a>
                        </li>
                        <li class="nav-item m-2">
                            <a class="nav-link" href="#konyvtaram" data-nezet="konyvtaram">Könyvtáram</a>
                        </li>
                        <li>
                            <a class="btn btn-info m-2" data-bs-toggle="offcanvas"
                                data-bs-target="#offcanvasScrolling">Szűrők</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Keresés" aria-label="Keresés" />
                        <button class="btn btn-outline-info" type="button"><i class="bi bi-search"></i></button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main class="py-4">
        <div class="container">
            <div class="offcanvas offcanvas-start" data-bs-scroll="true" data-bs-backdrop="true" tabindex="-1"
                id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasScrollingLabel">Szűrők:</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <p>Műfajok:</p>
                    <ul>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Akció" id="mufaj1">
                            <label class="form-check-label" for="mufaj1">
                                Akció
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Dráma" id="mufaj2">
                            <label class="form-check-label" for="mufaj2">
                                Dráma
                            </label>
                        </div>
                    </ul>
                    <p>Státusz:</p>
                    <ul>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Jelenleg nézem" id="statusz1">
                            <label class="form-check-label" for="statusz1">
                                Jelenleg nézem
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Látni akarom" id="statusz2">
                            <label class="form-check-label" for="statusz2">
                                Látni akarom
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Látni akarom" id="statusz2">
                            <label class="form-check-label" for="statusz2">
                                Megnéztem
                            </label>
                        </div>
                    </ul>
                    <button class="btn btn-success" type="button">Szűrés</button>
                </div>
            </div>
            <h3 class="text-white">Filmek</h3>
            <div id="FilmLista" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" aria-live="polite"></div>
            <h3 class="text-white mt-3">Sorozatok</h3>
            <div id="SorozatokLista" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 " aria-live="polite">
            </div>

            <div id="uresAllapot" class="text-center text-light py-5 d-none">
                <i class="bi bi-collection-play display-1 text-info" aria-hidden="true"></i>
                <h2 class="mt-3">Itt még nincs tartalom</h2>
                <p>Ebben a nézetben jelenleg nem található film vagy sorozat.</p>
            </div>
        </div>
    </main>
    <footer>
        <p class="text-center text-white">Minden jog Fenntartva!</p>
    </footer>
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h3 class="modal-title fs-5 " id="exampleModalLabel"></h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger torlesAlatamasz" data-bs-dismiss="modal">Törlés</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégsem</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/Film.js"></script>
    <script src="js/Sorozatok.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
