<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>FilmezzOkosan.hu</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand brand-title" href="#">
                    <img src="img/LOGO.png" alt="Logo" width="44" height="24" class="d-inline-block align-text-top">
                    <span style="color: #ffffff;">Filmezz</span><span style="color: #85FFF5;">Okosan</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Felfedezés</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Filmek</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Sorozatok</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Könyvtáram</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling"
                                href="#">Szűrők</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Keresés" aria-label="Keresés" />
                        <button class="btn btn-outline-info" type="button"><i class="bi bi-search"></i></button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="offcanvas offcanvas-start" data-bs-scroll="true" data-bs-backdrop="true" tabindex="-1"
                id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasScrollingLabel">Szűrők:</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <p>Műfajok:</p>
                        <ul>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="mufaj1">
                                <label class="form-check-label" for="mufaj1">
                                    Placeholder
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="mufaj2">
                                <label class="form-check-label" for="mufaj2">
                                    Placeholder
                                </label>
                            </div>
                    </ul>
                    <p>Státusz:</p>
                    <ul>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="statusz1">
                            <label class="form-check-label" for="statusz1">
                                Placeholder
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="statusz2">
                            <label class="form-check-label" for="statusz2">
                                Placeholder
                            </label>
                        </div>
                    </ul>
                    <button class="btn btn-success" type="button">Szűrés</button>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
